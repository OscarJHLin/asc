[project]
name = "asc-llm"
version = "0.1.0"
description = "Asc - Cross-platform distributed LLM inference system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.0",
    "filelock>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
asc-llm = "asc.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
